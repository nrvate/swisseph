name: CI

# Shared safety net for both in-flight plans:
#   notes/PLAN.md          section 0.4  (thread-safety)
#   notes/C17_MIGRATION.md section 6, Phase 5.4  (C17 migration)
# Both call for the same matrix; whichever landed it first was to build it
# for both. This is it.
#
# The gates themselves live in tests/Makefile and are NOT duplicated here --
# this workflow only supplies the toolchains and platforms that cannot be
# reached from a single dev box.
#
# On the numerical gate specifically:
#   tests/baseline.txt is pinned to gcc -O0. That is the ONLY configuration
#   where a bit-exact diff is meaningful. Measured on this tree, gcc -O0 vs
#   -O2 already differs in 224 values across 65 of 5127 rows -- median
#   2.2e-15, max 7.6e-08 deg (0.00027 arcsec), all in the speed fields,
#   which are finite-differenced and so amplify rounding.
#   So: gcc -O0 runs `check-golden` (bit-exact); every other toolchain runs
#   tests/cmpgolden.py with a tolerance instead. Using diff there would fail
#   for reasons that have nothing to do with our changes.

on:
  push:
    branches: [ master, threadsafe ]
  pull_request:
  workflow_dispatch:

env:
  # ephe/ is tracked in-repo (379 MB). sat/ (227 MB) and ep4/ (25 MB) are
  # not opened by any gate -- verified with strace -- so they are excluded
  # to keep checkout sane.
  EPHE: ephe
  # Measured, not picked. A cross-toolchain difference below ~1e-5 deg is
  # indistinguishable from the values' own input-noise floor: perturbing tjd
  # by +2 ULP already moves the worst non-ill-conditioned row (Moon, Moshier,
  # longitude speed, year +3000) by 8.7e-06 deg/day. 1e-5 deg is 0.036
  # arcsec, ~30x tighter than the library's quoted positional accuracy.
  # Real regressions are caught by check-golden, which is bit-exact.
  TOL: 1e-5

jobs:
  # ---------------------------------------------------------------------
  # The reference configuration. This is the one that owns baseline.txt,
  # and the only job allowed to assert bit-exactness.
  # ---------------------------------------------------------------------
  linux-gcc:
    name: linux / gcc (reference, bit-exact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!/ephe/sat/\n!/ephe/ep4/\n" }
      - name: Versions
        run: gcc --version && make --version | head -1
      # This is an ASSERTION, not a diagnostic.
      # The __APPLE__ exclusion in sweodef.h survived all of Phase 1 and
      # Phase 2 unnoticed, leaving swed a plain process-wide global on macOS
      # -- 23 KB of caches and open FILE*s shared across threads with no
      # synchronisation. It was found only because an earlier version of this
      # job PRINTED the expansion and a human read it. Fail the build instead.
      - name: TLS must be a real thread-local here
        run: |
          printf '#include "sweodef.h"\nTLS int probe;\n' > /tmp/p.c
          exp=$(cc -E -I. /tmp/p.c | tail -1)
          echo "TLS expands to: $exp"
          case "$exp" in
            *__thread*|*__declspec*) echo "ok" ;;
            *) echo "FAIL: TLS is empty -- swed would be a shared global"; exit 1 ;;
          esac
      - name: Build library
        run: make libswe.a
      - name: G1 numerical no-op (bit-exact, the pinned config)
        run: make -C tests check-golden EPHE=../$EPHE
      - name: G1b -O2 within tolerance
        run: make -C tests check-golden-O2 EPHE=../$EPHE TOL=$TOL
      - name: G2 config propagates to worker threads
        run: make -C tests check-threads EPHE=../$EPHE
      - name: Per-thread-setup still works
        run: make -C tests check-threads-workaround EPHE=../$EPHE
      - name: Race and leak gates
        run: |
          make -C tests check-sunrace  EPHE=../$EPHE
          make -C tests check-glprace  EPHE=../$EPHE
          make -C tests check-cfgleak  EPHE=../$EPHE
      # REVIEW.md J1. Runs under ASan; the ncf guard is a runtime check on a
      # file-supplied value, so a static_assert cannot cover it.
      - name: JPL header guards (malformed-file fixtures)
        run: make -C tests check-jplguard EPHE=../$EPHE

      # G10. jplguard covers header REJECTION; this covers the reader
      # actually computing. Bit-exact, so reference toolchain only --
      # same rule as check-golden.
      - name: JPL reader numerical baseline
        run: make -C tests check-jplcalc

      # G11. gcc/clang pick tier 3 at every -std=, so tiers 4 and 5 are
      # built by nothing else. Tier 5 had already rotted unbuildable.
      - name: swethread.h backends all build and compute
        run: make -C tests check-threadtiers EPHE=../$EPHE

      # G12. A bare swe_X() from inside the library silently uses the
      # default context. Two hand audits missed cases; this cannot.
      - name: No internal calls to legacy entry points
        run: make -C tests check-bridge
      - name: Threading shim
        run: make -C tests check-threadshim

      # G4. The only gate that can tell whether swe_ctx_new() does anything:
      # a swe_X_r() ignoring its context argument passes G1 and G2 both.
      - name: Independent contexts
        run: make -C tests check-ctx EPHE=../$EPHE

      # G9. Behaviour gates link only libswe.a and tests/, so nothing here
      # ever compiled swetest.c/swevents.c or any TRACE build. Phase 3 broke
      # `make all` for three phases with every other gate green.
      - name: Sample programs and TRACE build
        run: make -C tests check-build

  # ---------------------------------------------------------------------
  # LTO parity. `make LTO=1` is opt-in and was measured only on gcc 13,
  # where it is bit-identical to plain -O2 and worth ~5% on the Moshier
  # Moon path. This job exists to prove it does not change results under a
  # second toolchain before anyone considers making it the default.
  # ---------------------------------------------------------------------
  lto:
    runs-on: ubuntu-latest
    env:
      EPHE: ephe
      TOL: 1e-5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ephe/sat/
            !/ephe/ep4/
      - name: Build with LTO
        run: make LTO=1 libswe.a
      - name: Golden within tolerance
        run: make -C tests LTO=1 check-golden-O2 EPHE=../$EPHE TOL=$TOL
      - name: JPL reader baseline
        run: make -C tests LTO=1 check-jplcalc
      - name: Independent contexts
        run: make -C tests LTO=1 check-ctx EPHE=../$EPHE

  # ---------------------------------------------------------------------
  # Second compiler, same platform. Catches gcc-specific assumptions.
  # ---------------------------------------------------------------------
  linux-clang:
    name: linux / clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!/ephe/sat/\n!/ephe/ep4/\n" }
      - run: clang --version
      - name: Build + numerical check (tolerance, not diff)
        run: |
          make -C tests golden CC=clang EPHE=../$EPHE
          (cd tests && env -u SE_EPHE_PATH ./golden --ephe ../$EPHE > out_clang.txt)
          python3 tests/cmpgolden.py tests/baseline.txt tests/out_clang.txt --abs=$TOL --verbose
      - name: Thread gates
        run: |
          make -C tests check-threads              CC=clang EPHE=../$EPHE
          make -C tests check-threads-workaround   CC=clang EPHE=../$EPHE
          make -C tests check-sunrace CC=clang EPHE=../$EPHE
          make -C tests check-glprace CC=clang EPHE=../$EPHE
          make -C tests check-cfgleak CC=clang EPHE=../$EPHE
          make -C tests check-threadshim CC=clang

  # ---------------------------------------------------------------------
  # macOS. Historically the platform where TLS silently compiled to nothing
  # (sweodef.h excluded __APPLE__), which inverted the library's threading
  # behaviour -- see notes/INVESTIGATION.md section 3. Nobody has been able
  # to run these gates there.
  # ---------------------------------------------------------------------
  macos:
    name: macos / clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!/ephe/sat/\n!/ephe/ep4/\n" }
      - run: cc --version
      # This is an ASSERTION, not a diagnostic.
      # The __APPLE__ exclusion in sweodef.h survived all of Phase 1 and
      # Phase 2 unnoticed, leaving swed a plain process-wide global on macOS
      # -- 23 KB of caches and open FILE*s shared across threads with no
      # synchronisation. It was found only because an earlier version of this
      # job PRINTED the expansion and a human read it. Fail the build instead.
      - name: TLS must be a real thread-local here
        run: |
          printf '#include "sweodef.h"\nTLS int probe;\n' > /tmp/p.c
          exp=$(cc -E -I. /tmp/p.c | tail -1)
          echo "TLS expands to: $exp"
          case "$exp" in
            *__thread*|*__declspec*) echo "ok" ;;
            *) echo "FAIL: TLS is empty -- swed would be a shared global"; exit 1 ;;
          esac
      - name: Build + numerical check (tolerance)
        run: |
          make -C tests golden EPHE=../$EPHE
          (cd tests && env -u SE_EPHE_PATH ./golden --ephe ../$EPHE > out_macos.txt)
          python3 tests/cmpgolden.py tests/baseline.txt tests/out_macos.txt --abs=$TOL --verbose
      - name: Thread gates
        run: |
          make -C tests check-threads            EPHE=../$EPHE
          make -C tests check-threads-workaround EPHE=../$EPHE
          make -C tests check-sunrace EPHE=../$EPHE
          make -C tests check-glprace EPHE=../$EPHE
          make -C tests check-cfgleak EPHE=../$EPHE
          make -C tests check-threadshim

  # ---------------------------------------------------------------------
  # Windows / MSVC. The only way to exercise swethread.h's SRWLOCK backend,
  # which has never been run -- it is unreachable on Linux and macOS, and
  # was explicitly NOT claimed working in the Phase 2.1 commit.
  # ---------------------------------------------------------------------
  windows-msvc:
    name: windows / msvc (SRWLOCK backend)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!/ephe/sat/\n!/ephe/ep4/\n" }
      # Deliberately NOT ilammy/msvc-dev-cmd: it targets Node 20 (deprecated)
      # and is a third-party action sitting in the build path. The runners
      # ship Visual Studio, and the installer ships vswhere to locate it, so
      # call vcvars64.bat directly. One step, because vcvars sets environment
      # that does not survive between steps.
      - name: Build and check under MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          @echo on
          cl /nologo /c /W3 /DWIN32_LEAN_AND_MEAN sweconfig.c swedate.c swehouse.c swejpl.c swemmoon.c swemplan.c sweph.c swephlib.c swecl.c swehel.c || exit /b 1

          echo #include "sweodef.h" > tlsp.c
          echo TLS int probe; >> tlsp.c
          cl /nologo /EP /I. tlsp.c > tlsout.txt || exit /b 1
          findstr /C:"__declspec(thread)" tlsout.txt >nul || (echo FAIL: TLS is empty on MSVC & exit /b 1)
          echo ok: TLS is __declspec^(thread^)

          echo #include "swethread.h" > probe.c
          echo #include ^<stdio.h^> >> probe.c
          echo int main(void){ printf("backend=%%s\n", SWI_THREAD_BACKEND); return 0; } >> probe.c
          cl /nologo probe.c || exit /b 1
          probe.exe || exit /b 1

          cl /nologo /I. tests\threadshim.c || exit /b 1
          threadshim.exe || exit /b 1

  # ---------------------------------------------------------------------
  # Sanitizers. TSan needs ASLR off on some kernels, hence setarch -R.
  # ---------------------------------------------------------------------
  sanitizers:
    name: linux / tsan + asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!/ephe/sat/\n!/ephe/ep4/\n" }
      - name: ThreadSanitizer -- threaded golden must report zero races
        run: |
          cd tests
          cc -O1 -g -D_GNU_SOURCE -fsanitize=thread -I.. golden.c \
             ../sweconfig.c ../swedate.c ../swehouse.c ../swejpl.c ../swemmoon.c \
             ../swemplan.c ../sweph.c ../swephlib.c ../swecl.c ../swehel.c \
             -o golden_tsan -lm -ldl -lpthread
          setarch -R env TSAN_OPTIONS=halt_on_error=0 ./golden_tsan --ephe ../$EPHE --threads 4 > /dev/null 2> tsan.log || true
          n=$(grep -c "WARNING: ThreadSanitizer" tsan.log || true)
          echo "races reported: $n"; sed -n '1,40p' tsan.log
          test "$n" -eq 0
      - name: ThreadSanitizer -- shim and sunshine race
        run: |
          make -C tests check-threadshim-tsan
          make -C tests check-sunrace-tsan EPHE=../$EPHE
      - name: AddressSanitizer -- single-threaded golden
        run: |
          cd tests
          cc -O1 -g -D_GNU_SOURCE -fsanitize=address,undefined -I.. golden.c \
             ../sweconfig.c ../swedate.c ../swehouse.c ../swejpl.c ../swemmoon.c \
             ../swemplan.c ../sweph.c ../swephlib.c ../swecl.c ../swehel.c \
             -o golden_asan -lm -ldl -lpthread
          env -u SE_EPHE_PATH ./golden_asan --ephe ../$EPHE > /dev/null
      # LeakSanitizer on the context API. swe_ctx_free() must release what
      # the context allocated, and each thread must be able to release its
      # own TLS default state -- 9 KB per worker otherwise.
      - name: AddressSanitizer + LeakSanitizer -- context API
        run: |
          cd tests
          cc -O1 -g -D_GNU_SOURCE -fsanitize=address,undefined -I.. ctxtest.c \
             ../sweconfig.c ../swedate.c ../swehouse.c ../swejpl.c ../swemmoon.c \
             ../swemplan.c ../sweph.c ../swephlib.c ../swecl.c ../swehel.c \
             -o ctxtest_asan -lm -ldl -lpthread
          env -u SE_EPHE_PATH ASAN_OPTIONS=detect_leaks=1 ./ctxtest_asan --ephe ../$EPHE
      # ThreadSanitizer on the context API: two contexts driven from two
      # threads at once must report no races between them.
      - name: ThreadSanitizer -- independent contexts
        run: |
          cd tests
          cc -O1 -g -D_GNU_SOURCE -fsanitize=thread -I.. ctxtest.c \
             ../sweconfig.c ../swedate.c ../swehouse.c ../swejpl.c ../swemmoon.c \
             ../swemplan.c ../sweph.c ../swephlib.c ../swecl.c ../swehel.c \
             -o ctxtest_tsan -lm -ldl -lpthread
          env -u SE_EPHE_PATH ./ctxtest_tsan --ephe ../$EPHE

  # ---------------------------------------------------------------------
  # Windows package. Builds the MSVC solution and assembles a distributable
  # zip -- DLLs, import libs, static libs, CLI tools, headers.
  #
  # The project files in windows/projects/ are AUTHORITATIVE: this job
  # builds them, so they cannot rot the way the tree's other unbuilt code
  # did (interp(), swethread.h tier 5, sweephe4.c -- all unreachable, all
  # broken by the time anyone looked).
  #
  # They needed real repair to get here. As shipped in windows/sweph.zip
  # they used PlatformToolset v140_xp (removed in VS2019+), the Windows 8.1
  # SDK, an OutDir hardcoded to the original author's S: drive, and none of
  # the 15 listed sweconfig.c -- the file this branch added and the library
  # now requires.
  #
  # Each project is built at the platform its NAME implies. Building the
  # whole solution at one platform would happily produce a 64-bit
  # "swedll32.dll".
  # ---------------------------------------------------------------------
  windows-package:
    runs-on: windows-latest
    name: windows / package
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ephe/sat/
            !/ephe/ep4/
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build Win32 projects
        shell: cmd
        run: |
          cd windows\projects
          for %%p in (swedll32 swelib32 swetest swete32 swewin32 swedlltrm32 swedlltrs32) do (
            msbuild %%p.vcxproj /p:Configuration=Release /p:Platform=Win32 /v:minimal /nologo || exit /b 1
          )
      - name: Build x64 projects
        shell: cmd
        run: |
          cd windows\projects
          for %%p in (swedll64 swelib64 swetest64 swete64 swewin64 swedlltrm64 swedlltrs64) do (
            msbuild %%p.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo || exit /b 1
          )
      - name: Show what was built
        shell: cmd
        run: dir /s /b windows\projects\out
      - name: Smoke-test the CLI
        shell: cmd
        run: |
          rem cmd, not pwsh: PowerShell splits -b1.1.2020 into "-b1" and
          rem ".1.2020" before the program sees it, and swetest then reports
          rem "illegal option .1.2020".
          rem
          rem -emos is the Moshier ephemeris -- self-contained, so no .se1
          rem files are needed. Exit status alone proves little: swetest
          rem prints "illegal option" and carries on, which is how the first
          rem version of this step verified nothing at all.
          setlocal enabledelayedexpansion
          for %%e in ("out\x64\Release\swetest64.exe" "out\Win32\Release\swetest.exe") do (
            echo --- %%~e
            windows\projects\%%~e -b1.1.2020 -p0 -fPl -emos > swe_smoke.txt 2>&1
            if errorlevel 1 ( type swe_smoke.txt & echo FAIL: nonzero exit & exit /b 1 )
            type swe_smoke.txt
            findstr /C:"illegal option" swe_smoke.txt >nul && ( echo FAIL: argument rejected & exit /b 1 )
            rem The Sun's ecliptic longitude on 2020-01-01 is about 280 deg.
            findstr /C:"280" swe_smoke.txt >nul || ( echo FAIL: no plausible position & exit /b 1 )
          )
          echo both CLIs produce a plausible Sun position
      - name: Assemble package
        shell: pwsh
        run: |
          $out = "windows/projects/out"
          $pkg = "pkg/swisseph-windows"
          New-Item -ItemType Directory -Force -Path "$pkg/bin/x64","$pkg/bin/Win32",
                                                   "$pkg/lib/x64","$pkg/lib/Win32",
                                                   "$pkg/include" | Out-Null
          Copy-Item "$out/x64/Release/*.dll","$out/x64/Release/*.exe"     "$pkg/bin/x64"   -EA SilentlyContinue
          Copy-Item "$out/Win32/Release/*.dll","$out/Win32/Release/*.exe" "$pkg/bin/Win32" -EA SilentlyContinue
          Copy-Item "$out/x64/Release/*.lib"                              "$pkg/lib/x64"   -EA SilentlyContinue
          Copy-Item "$out/Win32/Release/*.lib"                            "$pkg/lib/Win32" -EA SilentlyContinue
          Copy-Item swephexp.h,sweodef.h,swedll.h,swedate.h,swehouse.h,swephlib.h "$pkg/include"
          Copy-Item LICENSE,THREADING.md "$pkg"
          Get-ChildItem -Recurse $pkg | Where-Object {!$_.PSIsContainer} |
            ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName.Replace((Get-Location).Path + "\", "") }
      - name: Package must not be empty
        shell: pwsh
        run: |
          # A silent msbuild failure would otherwise ship an empty zip.
          foreach ($f in @("pkg/swisseph-windows/bin/x64/swedll64.dll",
                           "pkg/swisseph-windows/bin/x64/swetest64.exe",
                           "pkg/swisseph-windows/lib/x64/swedll64.lib",
                           "pkg/swisseph-windows/bin/Win32/swedll32.dll")) {
            if (!(Test-Path $f)) { Write-Error "missing from package: $f"; exit 1 }
          }
          Write-Host "package contents verified"
      - uses: actions/upload-artifact@v4
        with:
          name: swisseph-windows
          path: pkg/swisseph-windows
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Dialects. The library floats on whatever -std= the local cc defaults to,
  # so pin each explicitly. C89 is EXPECTED to fail (58 errors on this tree,
  # long before either plan started) -- asserted as a known-fail so that if
  # the C17 migration ever makes it pass, we hear about it.
  # ---------------------------------------------------------------------
  dialects:
    name: linux / C dialects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!/ephe/sat/\n!/ephe/ep4/\n" }
      - name: Library must build at c99 / c11 / c17
        run: |
          for std in c99 gnu99 c11 gnu11 c17 gnu17; do
            echo "--- $std ---"
            for f in sweconfig swedate swehouse swejpl swemmoon swemplan sweph swephlib swecl swehel; do
              cc -std=$std -D_GNU_SOURCE -c -o /dev/null $f.c
            done
          done
      - name: C89 is expected to fail (pre-existing, not ours)
        run: |
          n=0
          for f in sweconfig swedate swehouse swejpl swemmoon swemplan sweph swephlib swecl swehel; do
            n=$((n + $(cc -std=c89 -D_GNU_SOURCE -c -o /dev/null $f.c 2>&1 | grep -c "error:" || true)))
          done
          echo "c89 errors: $n"
          if [ "$n" -eq 0 ]; then
            echo "c89 now builds clean -- that is good news, update this job"; exit 1
          fi
      - name: swethread.h across every backend it can select
        run: make -C tests check-threadshim-all

  # ---------------------------------------------------------------------
  # ABI. Additions are fine; removals and type changes are not.
  # ---------------------------------------------------------------------
  abi:
    name: linux / exported symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!/ephe/sat/\n!/ephe/ep4/\n" }
      - name: Compare exported symbols against the merge base
        run: |
          set -x
          cc -shared -fPIC -D_GNU_SOURCE -o /tmp/new.so \
             sweconfig.c swedate.c swehouse.c swejpl.c swemmoon.c swemplan.c \
             sweph.c swephlib.c swecl.c swehel.c -lm -ldl
          nm -D --defined-only /tmp/new.so | awk '{print $2, $3}' | sort > /tmp/new.sym
          base=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -z "$base" ]; then echo "no base commit, skipping"; exit 0; fi
          git worktree add -q /tmp/base "$base"
          cc -shared -fPIC -D_GNU_SOURCE -o /tmp/base.so \
             $(ls /tmp/base/sweconfig.c /tmp/base/swedate.c /tmp/base/swehouse.c \
                  /tmp/base/swejpl.c /tmp/base/swemmoon.c /tmp/base/swemplan.c \
                  /tmp/base/sweph.c /tmp/base/swephlib.c /tmp/base/swecl.c \
                  /tmp/base/swehel.c 2>/dev/null) -lm -ldl || { echo "base build failed, skipping"; exit 0; }
          nm -D --defined-only /tmp/base.so | awk '{print $2, $3}' | sort > /tmp/base.sym
          if comm -23 /tmp/base.sym /tmp/new.sym | grep .; then
            echo "ABI FAIL: symbol(s) removed or changed type"; exit 1
          fi
          echo "ABI ok: no symbol removed"

  # ---------------------------------------------------------------------
  # Upstream's own suite, used as a DIFFERENTIAL gate. It cannot be
  # pass/fail: t.exp was generated against the JPL ephemeris (de431.eph),
  # which this repo does not ship, so ~2730 assertions fail and the binary
  # aborts in suite_08_eclipses on pristine 3fd0f95 too. What must hold is
  # that its output is byte-identical before and after our changes.
  # ---------------------------------------------------------------------
  setest-differential:
    name: linux / setest differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, sparse-checkout-cone-mode: false, sparse-checkout: "/*\n!/ephe/sat/\n!/ephe/ep4/\n" }
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Capture reference from 3fd0f95, compare against HEAD
        run: |
          make -C tests setest-ref REF=3fd0f95 EPHE=../$EPHE
          make -C tests check-setest EPHE=../$EPHE
